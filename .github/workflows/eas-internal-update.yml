name: TBK Internal OTA Update

on:
  push:
    branches:
      - develop
      # Preview APKs installed directly on test phones listen to the internal
      # channel. Production fixes merged to main must reach those devices too.
      - main

jobs:
  update:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Publish EAS Update to internal channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel internal --environment preview --message "Git ${GITHUB_SHA}" --non-interactive
