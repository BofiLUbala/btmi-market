name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: btmi_market
          POSTGRES_USER: btmi_user
          POSTGRES_PASSWORD: btmi_secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Download Go modules
        run: go mod download
        working-directory: backend
      - name: Build
        run: go build ./cmd/... ./internal/...
        working-directory: backend
      - name: Vet
        run: go vet ./...
        working-directory: backend
      - name: Test
        run: go test ./...
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: btmi_market
          DB_USER: btmi_user
          DB_PASSWORD: btmi_secret_password
          REDIS_ADDR: localhost:6379
          REDIS_PASSWORD: ""
          REDIS_DB: "0"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web-app
      - name: Typecheck
        run: npm run typecheck
        working-directory: web-app
      - name: Test
        run: npm test
        working-directory: web-app
      - name: Build
        run: npm run build
        working-directory: web-app

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: android
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: android
