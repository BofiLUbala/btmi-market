name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg-test \
            -e POSTGRES_DB=btmi_market \
            -e POSTGRES_USER=btmi_user \
            -e POSTGRES_PASSWORD=btmi_secret_password \
            -p 5432:5432 \
            --health-cmd "pg_isready -U btmi_user -d btmi_market" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec pg-test pg_isready -U btmi_user -d btmi_market 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL $i/30"
            sleep 2
          done
      - name: Start Redis
        run: |
          docker run -d --name redis-test \
            -p 6379:6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            redis:7-alpine
          for i in $(seq 1 15); do
            if docker exec redis-test redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            echo "Waiting for Redis $i/15"
            sleep 1
          done
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Download Go modules
        run: go mod download
        working-directory: backend
      - name: Build
        run: go build ./cmd/... ./internal/...
        working-directory: backend
      - name: Vet
        run: go vet ./...
        working-directory: backend
      - name: Test
        run: go test ./...
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: btmi_market
          DB_USER: btmi_user
          DB_PASSWORD: btmi_secret_password
          REDIS_ADDR: localhost:6379
          REDIS_PASSWORD: ""
          REDIS_DB: "0"
      - name: Stop containers
        if: always()
        run: |
          docker stop pg-test redis-test 2>/dev/null || true
          docker rm pg-test redis-test 2>/dev/null || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web-app
      - name: Typecheck
        run: npm run typecheck
        working-directory: web-app
      - name: Test
        run: npm test
        working-directory: web-app
      - name: Build
        run: npm run build
        working-directory: web-app

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: android
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: android
