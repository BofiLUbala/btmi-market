name: TBK Production OTA Update

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Expo doctor
        run: npx expo-doctor

      - name: Publish EAS Update to production channel
        run: eas update --channel production --message "Production ${GITHUB_SHA}" --non-interactive
