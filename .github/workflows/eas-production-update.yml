name: TBK Production OTA Update

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Debug commit info
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          grep -q "CategoryAttributeDefinition" src/api/index.ts && echo "CategoryAttributeDefinition import OK"
          grep -q "recommendedType" app/seller/products/create.tsx && echo "recommendedType mapping OK"

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Expo doctor (advisory only, never blocks the publish)
        run: npx expo-doctor
        continue-on-error: true

      - name: Publish EAS Update to production channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # SDK 55+ requires an explicit EAS environment. Without this flag,
        # EXPO_PUBLIC_API_URL is not injected and physical Android devices
        # fall back to the emulator-only 10.0.2.2 address after an OTA update.
        run: eas update --channel production --environment production --message "Production ${GITHUB_SHA}" --non-interactive
