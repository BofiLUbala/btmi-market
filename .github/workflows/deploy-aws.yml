name: Deploy TBK to AWS

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - web-app/**
      - .github/workflows/deploy-aws.yml

concurrency:
  group: deploy-tbk-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy to EC2 via SSM
        run: |
          REMOTE_SCRIPT=$(cat <<'SCRIPT'
          set -e
          cd /opt/btmi-market
          git fetch origin main
          git reset --hard origin/main
          export APP_COMMIT_SHA=$(git rev-parse HEAD)
          echo "Deploying commit $APP_COMMIT_SHA"
          cd backend
          docker compose up -d --build

          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:8080/health >/dev/null; then
              echo "API is healthy"
              docker compose ps
              exit 0
            fi
            echo "Attempt $i/60 - API not ready, waiting 2s"
            sleep 2
          done

          echo "API health check timed out after 120s"
          docker compose ps
          docker compose logs --tail=200 api
          exit 1
          SCRIPT
          )

          # Build valid JSON instead of embedding shell code in a quoted AWS CLI
          # shorthand value. This preserves every quote and semicolon verbatim.
          jq -n --arg command "$REMOTE_SCRIPT" '{commands: [$command]}' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy TBK from GitHub Actions" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          SUCCESS=0

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              SUCCESS=1
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then
              echo "=== DEPLOY FAILED ($STATUS) ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json
              exit 1
            fi

            sleep 10
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Deployment timed out."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.AWS_INSTANCE_ID }}"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
