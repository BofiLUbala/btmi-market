server {
    listen 80;
    server_name _;

    # Docker's embedded DNS is queried at request time. Using a variable in
    # proxy_pass prevents Nginx from keeping a stale API container IP after a
    # docker compose rebuild/recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://api:8080;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy API calls to the backend api container (same Compose network).
    location /api/ {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Persisted product media served by the backend api container.
    # (^~ so file-extension regex below cannot intercept these requests)
    location ^~ /uploads/ {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
    }

    # SPA fallback so React Router paths work on refresh/direct navigation.
    location / {
        try_files $uri /index.html;
    }

    # Icon/favicon/logo files: no cache so updated assets are always fresh.
    location ~* /(favicon|apple-touch-icon|android-chrome|logo)\.(ico|png|jpeg|webp)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(js|css|png|webp|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
