server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy API calls to the backend api container (same Compose network).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Persisted product media served by the backend api container.
    # (^~ so file-extension regex below cannot intercept these requests)
    location ^~ /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback so React Router paths work on refresh/direct navigation.
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|png|webp|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
