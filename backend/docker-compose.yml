services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12
    environment:
      - APP_ENV=${APP_ENV:-development}
      - API_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-btmi_market}
      - DB_USER=${DB_USER:-btmi_user}
      - DB_PASSWORD=${DB_PASSWORD:-btmi_secret_password}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-10080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:?set SMTP_USER in .env}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
      - SMTP_FROM=${SMTP_FROM:-${SMTP_USER}}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - BACKGROUND_WORKER_ENABLED=false
      - MIGRATIONS_DIR=/migrations
      - VISUAL_SEARCH_URL=http://visual-search:8090
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
      - TOMTOM_API_KEY=${TOMTOM_API_KEY:-}
      # WhatsApp one-time codes through OpenWA (service `openwa` below).
      - OPENWA_URL=${OPENWA_URL:-}
      - OPENWA_API_KEY=${OPENWA_API_KEY:-}
      - OPENWA_SESSION_ID=${OPENWA_SESSION_ID:-}
      - WHATSAPP_DEFAULT_COUNTRY_CODE=${WHATSAPP_DEFAULT_COUNTRY_CODE:-243}
      # Push notifications; see .env.example.
      - PUSH_ENABLED=${PUSH_ENABLED:-true}
      - PUSH_WEB_ENABLED=${PUSH_WEB_ENABLED:-true}
      - PUSH_EXPO_ENABLED=${PUSH_EXPO_ENABLED:-true}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:support@tbkmarket.com}
      - EXPO_PUSH_URL=${EXPO_PUSH_URL:-}
      - EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN:-}
      - PUSH_EXTRA_HOSTS=${PUSH_EXTRA_HOSTS:-}
      - SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME:-}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-}
      - E2E_TEST_MODE=${E2E_TEST_MODE:-}
      - APP_COMMIT_SHA=${APP_COMMIT_SHA:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
    volumes:
      - ./migrations:/migrations:ro
      - uploads_data:/app/uploads
      - backups_data:/app/backups
      - exports_data:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      visual-search:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      # Loopback only. Containers reach Postgres over the internal Docker
      # network, so publishing on 0.0.0.0 exposed the database to every device
      # on the LAN.
      # Host port 5433 because a native Windows PostgreSQL service already
      # owns 5432 on this machine; connect host tools to localhost:5433.
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-btmi_market}
      - POSTGRES_USER=${DB_USER:-btmi_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-btmi_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-btmi_user} -d ${DB_NAME:-btmi_market}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      # Loopback only. Redis runs without a password, so publishing it on
      # 0.0.0.0 gave unauthenticated access to anyone on the LAN. The api and
      # worker containers reach it over the internal Docker network instead.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  visual-search:
    build:
      context: ./visual-search
      dockerfile: Dockerfile
    environment:
      - UPLOAD_DIR=/app/uploads
      - MODEL_PATH=/app/model/mobilenetv2-12.onnx
    volumes:
      - uploads_data:/app/uploads:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./worker"]
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-btmi_market}
      - DB_USER=${DB_USER:-btmi_user}
      - DB_PASSWORD=${DB_PASSWORD:-btmi_secret_password}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - BACKGROUND_WORKER_ENABLED=true
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:?set SMTP_USER in .env}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
      - SMTP_FROM=${SMTP_FROM:-${SMTP_USER}}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../web-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
        VITE_TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

  # OpenWA WhatsApp gateway (github.com/rmyndharis/OpenWA), only started with
  # `docker compose --profile whatsapp up -d`. Setup once:
  #   1. docker exec openwa-api cat /app/data/.api-key   -> OPENWA_API_KEY
  #   2. open http://localhost:2785, create a session, scan its QR with the
  #      WhatsApp account that will send the codes      -> OPENWA_SESSION_ID
  #   3. set OPENWA_URL=http://openwa:2785 in .env and restart `api`.
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: openwa-api
    profiles: ["whatsapp"]
    shm_size: 1gb
    ports:
      - "127.0.0.1:2785:2785"
    environment:
      - NODE_ENV=production
      - PORT=2785
      - TZ=UTC
      # Baileys speaks the WhatsApp protocol directly, without the Chromium
      # that the default whatsapp-web.js engine launches: lighter and reliable
      # on a small host.
      - ENGINE_TYPE=baileys
    volumes:
      - openwa_data:/app/data
    restart: unless-stopped

volumes:
  backups_data:
  exports_data:
  openwa_data:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
