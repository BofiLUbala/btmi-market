server {
    listen 80;
    server_name _;

    # The API's largest upload is the 8 MB avatar cap (product images are
    # capped lower, at 5 MB). Leave room for the multipart envelope so Nginx
    # does not replace the API's useful JSON error with a generic 413 response.
    client_max_body_size 9m;

    # Docker's embedded DNS is queried at request time. Using a variable in
    # proxy_pass prevents Nginx from keeping a stale API container IP after a
    # docker compose rebuild/recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://api:8080;
    set $admin_web http://admin-web:80;

    root /usr/share/nginx/html;
    index index.html;

    # Real-time order events (SSE): streamed as written, held open for an hour.
    # The API sends a heartbeat every 20 s and the clients reconnect on their own.
    location ~ ^/api/v1/(admin/commerce/)?events/stream$ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Reverse proxy API calls to the backend api container (same Compose network).
    location /api/ {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The admin console is the full web console (web-app/, admin-web
    # container): /admin pages go there (its own SPA fallback answers them)
    # and its built files live under /admin-console/. The files it names from
    # the site root (logos, category pictures) are forwarded too.
    location ^~ /admin-console/ {
        rewrite ^/admin-console/(.*)$ /$1 break;
        proxy_pass $admin_web;
        proxy_set_header Host $host;
    }
    location ^~ /admin {
        proxy_pass $admin_web;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # The token screens these paths used to borrow from admin-web now exist in
    # the Expo app — android/app/auth/activate.tsx,
    # auth/registration-recovery-confirm.tsx and courier/activate.tsx — so they
    # fall through to the site below like any other route, and web-app is left
    # serving only /admin.

    location = /tbk-admin-logo.png { proxy_pass $admin_web; }
    location = /logo.png { proxy_pass $admin_web; }
    location ^~ /assets/categories/ { proxy_pass $admin_web; }

    # Crawler files are generated by the API from the live catalog and the
    # FRONTEND_URL setting (absolute sitemap URL).
    location = /robots.txt {
        proxy_pass $api_backend/api/v1/seo/robots.txt;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass $api_backend/api/v1/seo/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Persisted product media served by the backend api container.
    # (^~ so file-extension regex below cannot intercept these requests)
    location ^~ /uploads/ {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
    }

    # SPA fallback so React Router paths work on refresh/direct navigation.
    # index.html must never be cached: it references the current build's
    # hashed JS/CSS filenames, so a stale cached copy keeps pointing browsers
    # at an old (or 404'd) bundle after every rebuild.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Push service worker: never cached, so a fix reaches every browser at once.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Icon/favicon/logo files: no cache so updated assets are always fresh.
    location ~* /(favicon|apple-touch-icon|android-chrome|logo)\.(ico|png|jpeg|webp)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(js|css|png|webp|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
